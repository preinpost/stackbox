# Quality gates for pull requests and pushes to dev. Nothing is
# built, tagged, uploaded, or released here; release.yml runs the same gates before it
# deploys from main.
name: ci

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The image has node but no Rust; the toolchain matches docker/agent.Dockerfile.
      - name: Install the Rust toolchain
        run: |
          set -eu
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/rustup-init.sh https://sh.rustup.rs
          sh /tmp/rustup-init.sh -y --profile minimal \
            --default-toolchain 1.99.1 -c clippy -c rustfmt
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - name: Check formatting
        run: |
          set -eu
          . "$HOME/.cargo/env"
          cargo fmt --check

      - name: Clippy
        run: |
          set -eu
          . "$HOME/.cargo/env"
          cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: |
          set -eu
          . "$HOME/.cargo/env"
          cargo test

      - name: Install the portal dependencies
        run: npm --prefix web ci

      - name: Portal tests
        run: |
          set -eu
          (cd web && npx vitest run)
          (cd web && node --test server/*.test.mjs)

      - name: Portal build
        run: npm --prefix web run build
