# Cuts a release for every push to main: bumps the version (patch unless a commit
# since the last release says #minor/[minor] or #major/[major]), commits it to main,
# tags it, builds the farm-agent for every platform a host can run, uploads them to
# the public R2 bucket, publishes a release that links them, and merges the result
# back into dev.
#
# The guest kernels are not part of this release: .forgejo/workflows/libkrunfw.yml builds and
# publishes them to the farm-libkrunfw bucket for linux-x86_64 and linux-aarch64 on its own
# schedule (push to main when the kernel scripts change, or workflow_dispatch). A release
# therefore neither waits for a kernel build nor changes the kernel a host installs.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Smallest bump to make; commit markers can raise it
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same gates as ci.yml, run on the commit before anything is bumped, tagged,
  # or uploaded. The release job needs it, so a failing gate deploys nothing.
  gate:
    if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-24.04
    timeout-minutes: 60
    # The runner's memory cannot link the debug test binaries in parallel (ld is
    # SIGKILLed); no debug info and two jobs keep the gates inside it.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      # The image has node but no Rust; the toolchain matches docker/agent.Dockerfile.
      - name: Install the Rust toolchain
        run: |
          set -eu
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/rustup-init.sh https://sh.rustup.rs
          sh /tmp/rustup-init.sh -y --profile minimal \
            --default-toolchain 1.99.1 -c clippy -c rustfmt
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - name: Check formatting
        run: |
          set -eu
          . "$HOME/.cargo/env"
          cargo fmt --check

      - name: Clippy
        run: |
          set -eu
          . "$HOME/.cargo/env"
          cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: |
          set -eu
          . "$HOME/.cargo/env"
          cargo test

      - name: Install the portal dependencies
        run: npm --prefix web ci

      - name: Portal tests
        run: |
          set -eu
          (cd web && npx vitest run)
          (cd web && node --test server/*.test.mjs)

      - name: Portal build
        run: npm --prefix web run build

  release:
    needs: gate
    # The release commit is pushed with the job token, which starts no runs; the
    # message check still stops a loop if RELEASE_TOKEN is a user token that would.
    if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: docker
    container:
      # docker CLI + buildx + node + jq; the runner's dind daemon builds every agent
      # (linux x86_64 under QEMU, macOS and Windows with zig) and keeps the
      # Dockerfiles' cargo cache mounts between runs.
      image: catthehacker/ubuntu:act-24.04
    timeout-minutes: 60
    env:
      TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      # scripts/build-agent.sh targets; the bare arches are Linux.
      TARGETS: x86_64 aarch64 macos-aarch64 windows-x86_64
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: public-bucket
      R2_PREFIX: farm-agent
      AGENT_BASE_URL: https://public-bucket.preinpost.in/farm-agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Pick the version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -eu
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            log=$(git log --format=%B "${prev:+$prev..}HEAD")
            rank() { case $1 in major) echo 2 ;; minor) echo 1 ;; *) echo 0 ;; esac; }
            level=$BUMP
            if printf '%s\n' "$log" | grep -Eqi '#major|\[major\]'; then marked=major
            elif printf '%s\n' "$log" | grep -Eqi '#minor|\[minor\]'; then marked=minor
            else marked=patch
            fi
            if [ "$(rank "$marked")" -gt "$(rank "$level")" ]; then level=$marked; fi
            major=${current%%.*} rest=${current#*.}
            minor=${rest%%.*} patch=${rest#*.}
            case $level in
              major) next=$((major + 1)).0.0 ;;
              minor) next=$major.$((minor + 1)).0 ;;
              *) next=$major.$minor.$((patch + 1)) ;;
            esac
            echo "$level bump: $current -> $next"
          else
            # A version set by hand on dev (or the first release) ships as written.
            next=$current
            echo "v$current is untagged; releasing it as is"
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "v$next already exists" >&2
            exit 1
          fi
          echo "PREV=$prev" >>"$GITHUB_ENV"
          echo "VERSION=$next" >>"$GITHUB_ENV"

      - name: Commit and tag
        run: |
          set -eu
          git config user.name forgejo-actions
          git config user.email forgejo-actions@noreply.git.preinpost.in
          sh scripts/set-version.sh "$VERSION"
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"

      # Only the SDK's .tbd stubs, kept as a private package: Apple's SDK must not be
      # published. The job token cannot read packages, hence PACKAGE_TOKEN.
      - name: Fetch the macOS SDK
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          set -eu
          if [ -z "$PACKAGE_TOKEN" ]; then
            echo "::error::set the PACKAGE_TOKEN secret to a token with read:package" >&2
            exit 1
          fi
          sdk=${RUNNER_TEMP:-/tmp}/sdk
          mkdir -p "$sdk"
          curl -fsSL -H "Authorization: token $PACKAGE_TOKEN" -o "$sdk.tar.xz" \
            "$GITHUB_SERVER_URL/api/packages/$GITHUB_REPOSITORY_OWNER/generic/macos-sdk/27.0/MacOSX27.0.sdk.tbd.tar.xz"
          echo "a82f2835037c783fed3ed5627a5060c92b01eeba8c7c174ab6b073135814deba  $sdk.tar.xz" | sha256sum -c -
          tar -xJf "$sdk.tar.xz" -C "$sdk"
          echo "MACOS_SDK=$sdk/MacOSX.sdk" >>"$GITHUB_ENV"

      # Built from the release commit, since the version bump changes FARM_BUILD_ID: a
      # coordinator built from the tag then accepts these agents. Nothing is pushed
      # until all of them build, so a failed build leaves no tag behind.
      - name: Build the agents
        run: |
          set -eu
          for target in $TARGETS; do
            sh scripts/build-agent.sh "$target"
          done
          ids=$(for target in $TARGETS; do
            grep -haoE 'farm-agent-build:[0-9a-f]+' dist/agent/"$target"/farm-agent*
          done | sort -u)
          # An empty $ids still counts as one line to wc, so check it separately.
          if [ -z "$ids" ] || [ "$(printf '%s\n' "$ids" | wc -l)" -ne 1 ]; then
            echo "no build id found, or the agents disagree on it: $ids" >&2
            exit 1
          fi
          echo "BUILD_ID=${ids#farm-agent-build:}" >>"$GITHUB_ENV"

      # Under the build id, which is all a coordinator knows, so the paths never change
      # and can be cached for good. Uploading before the push is harmless: the same
      # sources always give the same build id.
      - name: Upload the agents
        run: |
          set -eu
          manifest=${RUNNER_TEMP:-/tmp}/manifest.json
          jq -n --arg id "$BUILD_ID" --arg version "$VERSION" \
            '{build_id: $id, version: $version, agents: {}}' >"$manifest"
          for target in $TARGETS; do
            case $target in
              windows-*) file=farm-agent.exe ;;
              *) file=farm-agent ;;
            esac
            case $target in
              x86_64 | aarch64) platform=linux-$target ;;
              *) platform=$target ;;
            esac
            path=dist/agent/$target/$file key=$BUILD_ID/$platform/$file
            npx -y wrangler@4 r2 object put "$R2_BUCKET/$R2_PREFIX/$key" --remote --file "$path" \
              --content-type application/octet-stream --cache-control 'public, max-age=31536000, immutable'
            jq --arg platform "$platform" --arg key "$key" \
              --arg sha256 "$(sha256sum "$path" | cut -d' ' -f1)" --argjson size "$(wc -c <"$path")" \
              '.agents[$platform] = {path: $key, sha256: $sha256, size: $size}' \
              "$manifest" >"$manifest.next"
            mv "$manifest.next" "$manifest"
          done
          npx -y wrangler@4 r2 object put "$R2_BUCKET/$R2_PREFIX/$BUILD_ID/manifest.json" --remote \
            --file "$manifest" --content-type application/json --cache-control 'public, max-age=31536000, immutable'
          echo "MANIFEST=$manifest" >>"$GITHUB_ENV"
          cat "$manifest"

      - name: Push
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"

      - name: Point the version at its agents
        run: |
          set -eu
          index=${RUNNER_TEMP:-/tmp}/version.json
          jq -n --arg id "$BUILD_ID" --arg version "$VERSION" '{version: $version, build_id: $id}' >"$index"
          npx -y wrangler@4 r2 object put "$R2_BUCKET/$R2_PREFIX/v$VERSION.json" --remote \
            --file "$index" --content-type application/json --cache-control 'public, max-age=31536000, immutable'
          npx -y wrangler@4 r2 object put "$R2_BUCKET/$R2_PREFIX/latest.json" --remote \
            --file "$index" --content-type application/json --cache-control 'public, max-age=60'

      - name: Publish the release
        run: |
          set -eu
          notes=${RUNNER_TEMP:-/tmp}/notes.md body=${RUNNER_TEMP:-/tmp}/release.json
          {
            git log --no-merges --format='- %s (%h)' "${PREV:+$PREV..}v$VERSION" \
              | grep -v '^- Release v' || true
            printf '\n### farm-agent\n\nBuild id `%s`. A coordinator built from this tag accepts these agents ([manifest](%s/%s/manifest.json)).\n\n' \
              "$BUILD_ID" "$AGENT_BASE_URL" "$BUILD_ID"
            printf '| platform | sha256 |\n|---|---|\n'
            jq -r --arg base "$AGENT_BASE_URL" \
              '.agents | to_entries[] | "| [\(.key)](\($base)/\(.value.path)) | `\(.value.sha256)` |"' "$MANIFEST"
          } >"$notes"
          node -e '
            const fs = require("fs");
            const [tag, notes] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({ tag_name: tag, name: tag, body: fs.readFileSync(notes, "utf8") }));
          ' "v$VERSION" "$notes" >"$body"
          curl -fsS -X POST \
            -H "Authorization: token $TOKEN" \
            -H 'Content-Type: application/json' \
            --data @"$body" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases" >/dev/null

      - name: Merge back into dev
        run: |
          set -eu
          if ! git ls-remote --exit-code --heads origin dev >/dev/null; then
            echo "no dev branch; nothing to merge into"
            exit 0
          fi
          git fetch origin dev
          git checkout -B dev origin/dev
          git merge --no-edit -m "Merge v$VERSION into dev" "v$VERSION^{commit}"
          git push origin HEAD:refs/heads/dev
