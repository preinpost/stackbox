[package]
name = "farm"
version = "0.1.1"
edition = "2024"
default-run = "farm"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4"
futures = "0.3.34"
microsandbox = { version = "=0.7.8", default-features = false, features = ["local", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
subtle = "2"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process"] }
utoipa = "5"
uuid = { version = "1", features = ["v4"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.2"
sha2 = "0.10"
# Hosts that dial in to the coordinator; ring matches russh's crypto backend.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
