<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta
      name="description"
      content="로컬 OpenStack VM farm을 생성하고 관리하는 운영 포탈"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>farm — VM workspace</title>
    <script>
      // Sets the theme before first paint, so a dark workspace never flashes light.
      // src/theme.ts owns the same rule once the app boots.
      (() => {
        try {
          const stored = localStorage.getItem("farm-theme");
          const dark = matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : dark
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "dark" ? "#0f1210" : "#f6f6f3");
        } catch {
          // No storage: the light theme in the stylesheet stands.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
