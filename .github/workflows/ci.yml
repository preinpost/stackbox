# Quality gates for pull requests and pushes to dev. Nothing is built, tagged, uploaded, or
# released here; release.yml runs the same gates before it publishes from main.
name: ci

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Linking debug test binaries in parallel can exhaust memory on small runners; no debug info
    # and two jobs keep the gates within them.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Install the portal dependencies
        run: npm --prefix web ci

      - name: Portal tests
        run: |
          set -eu
          (cd web && npx vitest run)
          node --test web/server/*.test.mjs

      - name: Portal build
        run: npm --prefix web run build
