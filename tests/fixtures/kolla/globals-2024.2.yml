---
kolla_base_distro: "rocky"
# Kolla images the farm built and published for this series.
docker_registry: "ghcr.io"
docker_namespace: "preinpost/kolla"
openstack_release: "2024.2"
openstack_tag_suffix: ""
kolla_internal_vip_address: "10.254.0.2"
network_interface: "farm0"
api_interface: "farm0"
database_address: "10.254.0.2"
kolla_external_vip_address: "10.254.0.2"
kolla_external_vip_interface: "farm0"

# quay.io/openstack.kolla images are flagged as test images by prechecks.
kolla_test_images: true
# msb keeps the guest clock in step with the host; there is no NTP daemon to detect.
prechecks_enable_host_ntp_checks: false
# This release's list of supported host distributions predates this guest.
prechecks_enable_host_os_checks: false
# This guest has no SELinux, and the venv's Python has no `selinux` binding; the role's
# no-op would fail importing it.
change_selinux: false
docker_sdk_packages_dbus_deps_redhat:
  - dbus-daemon
  - dbus-devel
  - gcc
  - glib2-devel
  - python3-devel

# The guest kernel has no module loading (/proc/modules is absent) and ip6_tables is built
# in. 2025.1 and 2025.2 would otherwise `modprobe` Neutron's default modules and fail the
# deploy's last play; every other service that loads one is off or patched.
neutron_modules_default: []
# The API services bind directly to this VM; SDK port mappings expose them.
enable_keepalived: false
enable_haproxy: false
enable_proxysql: false
enable_fluentd: false

# Bound process and cache counts for the compact all-in-one memory budget.
openstack_service_workers: 1
openstack_service_rpc_workers: 1
memcached_max_memory: 64
rabbitmq_server_additional_erl_args: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none"

enable_openstack_core: false
enable_heat: false
enable_mariadb: true
enable_memcached: true
enable_rabbitmq: true
enable_keystone: true
enable_glance: true
glance_backend_file: true
enable_placement: true
enable_horizon: true
enable_neutron: true
enable_nova: true
neutron_external_interface: "farm-ext"
neutron_plugin_agent: "openvswitch"
ovs_datapath: "netdev"
openvswitch_vswitchd_extra_volumes: "{{ default_extra_volumes + ['/etc/farm/ovs-extend-start:/usr/local/bin/kolla_openvswitch_extend_start:ro'] }}"
neutron_l3_agent_extra_volumes: "{{ neutron_extra_volumes + ['/etc/farm/neutron-sitecustomize.py:/var/lib/kolla/venv/lib64/python3.9/site-packages/sitecustomize.py:ro'] }}"
nova_compute_virt_type: "qemu"
nova_libvirt_cpu_mode: "none"
nova_console: "none"
