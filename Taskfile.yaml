version: '3'

tasks:
  agent-build:
    desc: Build the Linux stackbox-agent artifacts (ARCHS="x86_64 aarch64"); skipped while their sources are unchanged
    vars:
      ARCHS: '{{.ARCHS | default "x86_64 aarch64"}}'
    # The same inputs build.rs hashes into the build id, so a skip never leaves a stale artifact.
    sources:
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - src/**/*.rs
      - src/**/*.py
      - src/**/*.diff
      - src/**/*.sh
      - guest/**/*
      - docker/agent.Dockerfile
      - docker/agent-cross.Dockerfile
    generates:
      - dist/agent/*/stackbox-agent
    cmds:
      - for: { var: ARCHS }
        cmd: sh scripts/build-agent.sh {{.ITEM}}
  golden:
    desc: Build this machine's golden image with msb now rather than with the first stackbox
    cmds:
      - cargo run --release -- golden
  libkrunfw:
    desc: Build this machine's guest kernel with the fragments in scripts/libkrunfw/fragments (pass flags after --)
    cmds:
      - sh scripts/build-libkrunfw.sh {{.CLI_ARGS}}
  libkrunfw:all:
    desc: Build the guest kernels with the same fragments for both aarch64 and x86_64 (pass flags after --)
    cmds:
      - sh scripts/build-libkrunfw.sh --arch all {{.CLI_ARGS}}
  libkrunfw:path:
    desc: Print the kernel this machine built (diagnostics; stackbox installs it on hosts during preparation)
    cmds:
      - sh scripts/libkrunfw-path.sh {{.CLI_ARGS}}
  build:
    desc: Build the stackbox release binary
    cmds:
      - cargo build --release
  serve:
    desc: Run the stackbox API daemon on 127.0.0.1:10010 (pass flags after --)
    cmds:
      - cargo run --release -- serve {{.CLI_ARGS}}
  dev:
    desc: Run the stackbox API daemon and the local web portal together
    # The coordinator only installs agents built from its own sources, so build them together.
    deps: [build]
    cmds:
      - task: dev-kernel
      - task: dev-agents
      - task: dev-run
  dev-kernel:
    internal: true
    # stackbox installs this kernel on hosts as it prepares them; mtty stackboxes need it. Without
    # Docker the build is skipped and every host keeps the stock kernel (no mtty device).
    cmds:
      - task: libkrunfw:all
        ignore_error: true
  dev-agents:
    internal: true
    # A released build's coordinator downloads its agents from the release bucket instead.
    status:
      - sh scripts/agents-published.sh target/release/stackbox
    cmds:
      - task: agent-build
        # Without Docker, local stackboxes still work; only remote hosts need these artifacts.
        ignore_error: true
  dev-run:
    internal: true
    deps: [serve, portal-dev]
  portal-install:
    desc: Install web portal dependencies; skipped while package.json and the lockfile are unchanged
    # npm ci writes node_modules/.package-lock.json, so a deleted node_modules installs again.
    sources:
      - web/package.json
      - web/package-lock.json
    generates:
      - web/node_modules/.package-lock.json
    cmds:
      - npm --prefix web ci
  portal-dev:
    desc: Run the local web portal (run task serve separately)
    deps: [portal-install]
    cmds:
      - npm --prefix web run dev
  portal-build:
    desc: Type-check and build the web portal
    deps: [portal-install]
    cmds:
      - npm --prefix web run build
  portal-serve:
    desc: Run the built web portal on 127.0.0.1:10020
    cmds:
      - npm --prefix web start
