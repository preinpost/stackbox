version: '3'

tasks:
  agent-build:
    desc: Build the Linux farm-agent artifacts (ARCHS="x86_64 aarch64"); skipped while their sources are unchanged
    vars:
      ARCHS: '{{.ARCHS | default "x86_64 aarch64"}}'
    # The same inputs build.rs hashes into the build id, so a skip never leaves a stale artifact.
    sources:
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - src/**/*.rs
      - src/**/*.py
      - docker/agent.Dockerfile
    generates:
      - dist/agent/*/farm-agent
    cmds:
      - for: { var: ARCHS }
        cmd: sh scripts/build-agent.sh {{.ITEM}}
  docker-build:
    desc: Build farm-golden:rocky10 image
    cmds:
      - docker build -t farm-golden:rocky10 ./docker
      - docker save farm-golden:rocky10 | msb load --tag farm-golden:rocky10
  run-vm:
    desc: Run farm-golden:rocky10 image as a VM
    deps: [docker-build]
    vars:
      NAME: '{{.NAME | default "devbox"}}'
      CPUS: '{{.CPUS | default "2"}}'
      MEMORY: '{{.MEMORY | default "4G"}}'
      DISK: '{{.DISK | default "30G"}}'
    cmds:
      - |
        msb create --name {{.NAME}} \
          --cpus {{.CPUS}} \
          --memory {{.MEMORY}} \
          --root-disk {{.DISK}} \
          --net public,private \
          --init /sbin/init \
          --replace \
          farm-golden:rocky10
      - msb exec {{.NAME}} -- ip -4 -brief addr show eth0
  destroy-vm:
    desc: Destroy the VM
    cmds:
      - msb stop devbox && msb rm devbox
  build:
    desc: Build the farm release binary
    cmds:
      - cargo build --release
  serve:
    desc: Run the farm API daemon on 127.0.0.1:8080 (pass flags after --)
    cmds:
      - cargo run --release -- serve {{.CLI_ARGS}}
  dev:
    desc: Run the farm API daemon and the local web portal together
    # The coordinator only installs agents built from its own sources, so build them together.
    deps: [build]
    cmds:
      - task: dev-agents
      - task: dev-run
  dev-agents:
    internal: true
    # A released build's coordinator downloads its agents from the release bucket instead.
    status:
      - sh scripts/agents-published.sh target/release/farm
    cmds:
      - task: agent-build
        # Without Docker, local farms still work; only remote hosts need these artifacts.
        ignore_error: true
  dev-run:
    internal: true
    deps: [serve, portal-dev]
  portal-install:
    desc: Install web portal dependencies
    cmds:
      - npm --prefix web ci
  portal-dev:
    desc: Run the local web portal (run task serve separately)
    cmds:
      - npm --prefix web run dev
  portal-build:
    desc: Type-check and build the web portal
    cmds:
      - npm --prefix web run build
  portal-serve:
    desc: Run the built web portal on 127.0.0.1:3000
    cmds:
      - npm --prefix web start
