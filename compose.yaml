# stackbox coordinator and web portal, packaged as one container.
#
# Quick start:
#   docker compose up -d --build
#   open http://127.0.0.1:10020
#
# Set STACKBOX_API_TOKEN to a random secret before using the service for anything real.
# Without it, the API accepts requests without authentication.
#   export STACKBOX_API_TOKEN="$(openssl rand -hex 32)"
#
# To reach the portal from other machines (for example, behind a reverse proxy or tunnel):
#   1. Set STACKBOX_API_TOKEN as above.
#   2. Set PORTAL_ALLOWED_HOSTS to the host name clients use, e.g. stackbox.example.com.
#      Loopback names are always accepted.
#   3. Change the port binding below from 127.0.0.1 to 0.0.0.0 (or another address you choose).
#
# Private relay (hosts reach the coordinator directly over TLS): uncomment the 10011 port below and
#   set STACKBOX_RELAY_TLS=private and STACKBOX_RELAY_BIND=0.0.0.0:10011 in `environment`.
#   See README.md.
#
# STACKBOX_PORT changes the host port (default 10020).

services:
  stackbox:
    build: .
    image: stackbox:local
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # Loopback only by default, so the unauthenticated API is not exposed to the network.
      - "127.0.0.1:${STACKBOX_PORT:-10020}:10020"
      # - "10011:10011"   # private relay, see the comment above
    volumes:
      - stackbox-data:/data   # state.json and other stackbox state (STACKBOX_STATE_DIR=/data)
    environment:
      # Bearer token for the API; the portal proxy adds it. Empty means no authentication.
      STACKBOX_API_TOKEN: ${STACKBOX_API_TOKEN:-}
      # Extra Host names the portal accepts, comma-separated (loopback names are always accepted).
      PORTAL_ALLOWED_HOSTS: ${PORTAL_ALLOWED_HOSTS:-}

volumes:
  stackbox-data:
